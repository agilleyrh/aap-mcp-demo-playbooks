---
# Listens for log events and triggers when CRITICAL appears in the payload.
# The webhook source is replaced by the AAP event stream at activation time.
- name: Critical log alert listener
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Trigger on CRITICAL log events
      condition: event.payload.message is search("CRITICAL", ignorecase=true) or event.payload.log is search("CRITICAL", ignorecase=true) or event.payload.body is search("CRITICAL", ignorecase=true) or event.payload.level == "CRITICAL" or event.payload.severity == "CRITICAL"
      action:
        run_job_template:
          name: Handle Critical Log Alert
          organization: Default

    - name: Acknowledge non-critical log events
      condition: event.payload is defined
      action:
        debug:
          msg: "Log event received (no CRITICAL match): {{ event.payload | to_json }}"
