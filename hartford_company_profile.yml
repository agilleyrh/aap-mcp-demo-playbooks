---
# The Hartford Company Profile — harmless, read-only debug output about The Hartford.
# Pass extra_vars: demo_run_id (string), should_fail (bool, optional)
- name: The Hartford — Corporate profile briefing
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Initialize audit session
      ansible.builtin.set_fact:
        audit_run_id: "{{ demo_run_id | default('hartford-audit-unknown') }}"
        audit_start: "{{ ansible_date_time.iso8601 }}"
        audit_log: []
        company_profile:
          legal_name: "The Hartford Insurance Group, Inc."
          brand_name: "The Hartford"
          ticker: "NYSE: HIG"
          founded: 1810
          headquarters: "One Hartford Plaza, Hartford, Connecticut 06155"
          website: "https://www.thehartford.com"
          industry: "Property & casualty insurance, employee benefits, mutual funds"
          fortune_500_rank_2024: 162

    - name: Display corporate banner
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "  THE HARTFORD — COMPANY PROFILE AUDIT (READ-ONLY DEBUG OUTPUT)"
          - "================================================================"
          - "  Audit run ID .......... {{ audit_run_id }}"
          - "  Audit station ......... {{ ansible_hostname }}"
          - "  Session started ....... {{ audit_start }}"
          - "  Ansible version ....... {{ ansible_version.full }}"
          - "================================================================"

    - name: Log audit start
      ansible.builtin.set_fact:
        audit_log: "{{ audit_log + ['AUDIT START: ' ~ audit_start] }}"

- name: The Hartford — Company overview
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Build company overview facts
      ansible.builtin.set_fact:
        company_overview:
          description: >-
            The Hartford is a U.S.-based public insurance and financial services company.
            It sells automobile, property, liability, workers' compensation, and group
            benefits products primarily through agents and brokers.
          key_people:
            chairman_ceo: "Christopher J. Swift"
            cfo: "Beth A. Costello"
            controller: "Allison Niderno"
          employee_count_approx: "~27,220 (2026 public reporting)"
          aarp_partnership: "Auto and home insurance writer for AARP members for 40+ years"

    - name: Report company overview
      ansible.builtin.debug:
        var: company_overview

    - name: Build product portfolio snapshot
      ansible.builtin.set_fact:
        product_portfolio:
          personal_lines:
            - "Automobile insurance"
            - "Homeowners insurance"
          commercial_lines:
            - "Property insurance"
            - "General liability"
            - "Workers' compensation"
          benefits_and_investments:
            - "Group benefits"
            - "Mutual funds"
            - "Exchange-traded funds"

    - name: Report product portfolio
      ansible.builtin.debug:
        var: product_portfolio

- name: The Hartford — Historical milestones
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Build historical timeline
      ansible.builtin.set_fact:
        historical_milestones:
          - year: 1810
            event: "Founded as Hartford Fire Insurance Company with $15,000 in working capital"
          - year: 1835
            event: "President Eliphalet Terry used personal wealth to cover claims after the New York financial district fire"
          - year: 1871
            event: "Responded to losses from the Great Chicago Fire"
          - year: 1906
            event: "Supported policyholders after the San Francisco earthquake and fire"
          - year: 1984
            event: "Began auto and home insurance partnership with AARP"
          - year: 2014
            event: "Christopher J. Swift appointed Chief Executive Officer"

    - name: Report historical milestones
      ansible.builtin.debug:
        var: historical_milestones

- name: The Hartford — Public financial highlights
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Build financial highlights (public reporting)
      ansible.builtin.set_fact:
        financial_highlights:
          note: "Static public figures for demo/debug output — not live market data"
          revenue_usd_billions_2025: 28.4
          net_income_usd_billions_2025: 3.8
          total_assets_usd_billions_2025: 86.0
          assets_under_management_usd_billions: 154.2
          commercial_lines_written_premiums_usd_billions_2024: 13.5
          personal_lines_written_premiums_usd_billions_2024: 3.6

    - name: Report financial highlights
      ansible.builtin.debug:
        var: financial_highlights

- name: The Hartford — Local audit station telemetry
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Collect audit station profile
      ansible.builtin.set_fact:
        audit_station_profile:
          hostname: "{{ ansible_hostname }}"
          fqdn: "{{ ansible_fqdn }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          architecture: "{{ ansible_architecture }}"
          python: "{{ ansible_python_version }}"

    - name: Report audit station profile
      ansible.builtin.debug:
        var: audit_station_profile

    - name: Collect resource telemetry
      ansible.builtin.set_fact:
        resource_telemetry:
          cpu_vcpus: "{{ ansible_processor_vcpus | default('n/a') }}"
          memory_total_mb: "{{ ansible_memtotal_mb | default(0) }}"
          memory_free_mb: "{{ ansible_memfree_mb | default(0) }}"
          load_1m: "{{ ansible_loadavg['1m'] | default('n/a') }}"

    - name: Report resource telemetry
      ansible.builtin.debug:
        var: resource_telemetry

- name: The Hartford — Audit completion
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Optional simulated failure for demo history
      ansible.builtin.fail:
        msg: >-
          Simulated audit exception for run {{ audit_run_id }}
          (expected in some demo batches when should_fail=true)
      when: should_fail | default(false) | bool

    - name: Finalize audit log
      ansible.builtin.set_fact:
        audit_log: "{{ audit_log + ['AUDIT COMPLETE: ' ~ ansible_date_time.iso8601] }}"

    - name: Display audit summary
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - "  THE HARTFORD COMPANY PROFILE AUDIT — COMPLETE"
          - "================================================================"
          - "  Audit run ID .......... {{ audit_run_id }}"
          - "  Company ............... {{ company_profile.brand_name }}"
          - "  Ticker ................ {{ company_profile.ticker }}"
          - "  Founded ............... {{ company_profile.founded }}"
          - "  HQ .................... {{ company_profile.headquarters }}"
          - "  Audit station ......... {{ audit_station_profile.hostname | default(ansible_hostname) }}"
          - "  Status ................ SUCCESS — no system changes made"
          - "================================================================"
