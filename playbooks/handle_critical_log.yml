---
# Read-only response playbook for CRITICAL log events triggered by EDA.
- name: Handle critical log alert
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Extract event payload
      ansible.builtin.set_fact:
        critical_event: "{{ ansible_eda.event | default({}) }}"
        critical_payload: "{{ ansible_eda.event.payload | default({}) }}"

    - name: Display critical log incident banner
      ansible.builtin.debug:
        msg:
          - "################################################################"
          - "#  CRITICAL LOG ALERT — EVENT-DRIVEN AUTOMATION RESPONSE        #"
          - "################################################################"
          - "  Detected at ........... {{ ansible_date_time.iso8601 }}"
          - "  Response host ......... {{ ansible_hostname }}"
          - "  Alert level ........... CRITICAL"
          - "################################################################"

    - name: Display full event payload
      ansible.builtin.debug:
        var: critical_payload

    - name: Display recommended operator actions
      ansible.builtin.debug:
        msg:
          - "[ACTION] Investigate the source system that emitted this CRITICAL log"
          - "[ACTION] Correlate with monitoring dashboards and recent change tickets"
          - "[ACTION] Escalate to on-call if service impact is confirmed"
          - "[NOTE]   This playbook is read-only — no remediation was performed"
